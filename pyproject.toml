[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data", "__pycache__", ".venv"]

[tool.ruff.lint]
# М'який набір: синтаксичні/логічні ловушки (E9), невизначені імена та
# дублікати (F821/F811), невикористані імпорти/змінні (F401/F841).
# Legacy-код свідомо не перечіплюємо під повний E-набір.
select = ["E9", "F"]
