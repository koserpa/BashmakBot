name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (all modules)
        run: |
          python -m py_compile bot.py handlers.py config.py vulcan_utils.py \
            vulcan_autologin.py vulcan_notify.py reminder_utils.py search_utils.py \
            plugins/vulcan.py tasks.py
      - name: Unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python test_vulcan_notify.py
          python test_vulcan_autologin.py
          python test_vulcan_utils.py
          python test_text_utils.py
