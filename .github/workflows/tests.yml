name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (all tracked modules)
        run: |
          # git ls-files, а не ручний список: новий модуль не забудеться
          python -m py_compile $(git ls-files '*.py')
      - name: Unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # усі офлайн-тести; live/smoke (smoke_test_plugins.py) сюди не входять
          for f in test_*.py; do
            echo "=== $f"
            python "$f"
          done
